# Use this ONLY when a Caddy (or nginx) already runs on the host itself and
# owns ports 80/443 — as was the case on 139.162.51.165 on 2026-09-19. Two
# things cannot bind the same port, so this override:
#
#   1. removes the compose stack's own `caddy` service, and
#   2. publishes the API on 127.0.0.1:3000 — loopback ONLY, so the host's
#      proxy can reach it and nothing on the internet can. Publishing on
#      0.0.0.0 would let a caller bypass TLS and forge X-Forwarded-For, which
#      TRUST_PROXY=true would then believe.
#
# Then add to the host's /etc/caddy/Caddyfile and `systemctl reload caddy`:
#
#   139-162-51-165.sslip.io {
#       reverse_proxy 127.0.0.1:3000
#   }
#
# Every command must include both files, in this order, every time —
# `docker compose up -d` alone would start the stack's caddy and fail to bind:
#
#   docker compose -f docker-compose.yml -f docker-compose.host-caddy.yml up -d
#
# Or set it once per shell and forget it:
#
#   export COMPOSE_FILE=docker-compose.yml:docker-compose.host-caddy.yml
#
# deploy.sh honours COMPOSE_FILE, so the export is all it needs.

services:
  # Parked in a profile nothing ever enables, so `up` skips it. (Portable
  # across compose versions, unlike the `!reset` tag on a whole service.)
  caddy:
    profiles: ["never"]

  api:
    ports:
      - "127.0.0.1:3000:3000"

# The eBPCO API as it actually runs on LGUIDS-SHARED-LINODE (139.162.51.165),
# in /opt/ebpco. This file IS that file — keep the two identical; push-source.sh
# copies this one over.
#
#   public ── :443 ──► caddy ──► ebpco-api:3000 ──► postgres:5432
#                                        └────────► minio:9000  (S3 store)
#
# First stood up on 2026-09-17 by hand and never versioned, which is how a
# second, incompatible stack nearly got deployed beside it on 2026-09-19.
# Now tracked here, with two additions: BUILD_COMMIT/BUILD_TIME build args so
# /version can name the build, and the comments.
#
# Layout on the host, relative to /opt/ebpco:
#   backend/            the backend repository tree (apps/ebpco-api is built)
#   Caddyfile           deploy/Caddyfile
#   infra.env           from deploy/infra.env.example   — Postgres/MinIO secrets
#   server.env          from deploy/server.env.example  — the API's environment
#   data/{postgres,minio,caddy_data,caddy_config}       — bind-mounted state

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file: infra.env
    environment:
      POSTGRES_USER: ebpco
      POSTGRES_DB: ebpco
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      # Loopback only: for `psql` and `pg_dump` from the host, never the internet.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ebpco -d ebpco"]
      interval: 5s
      timeout: 5s
      retries: 20

  # S3-compatible object store on the same host. What lets the API run its
  # `s3` driver (the only one production accepts) without a cloud bucket yet.
  # Documents live in ./data/minio — on this one disk, so back it up.
  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    env_file: infra.env
    environment:
      MINIO_ROOT_USER: ebpco-minio
    volumes:
      - ./data/minio:/data
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Creates the bucket once, then exits. Idempotent (`mb || true`).
  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    env_file: infra.env
    environment:
      MINIO_ROOT_USER: ebpco-minio
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ebpco-minio \"$$MINIO_ROOT_PASSWORD\" &&
      (mc mb local/ebpco-documents || true) &&
      echo bucket-ready
      "
    restart: "no"

  # One-off: `docker compose run --rm migrate`. Same Dockerfile, the `migrate`
  # target — the only image allowed to keep ts-node and scripts/. Also the
  # image for `run --rm migrate npm run seed:super-admin`.
  migrate:
    build:
      context: ./backend/apps/ebpco-api
      dockerfile: Dockerfile
      target: migrate
    # A profile nothing enables, so `up -d` does not start it as a container;
    # `run --rm migrate` still works because compose enables the profile of
    # the service named on the command line.
    profiles: ["ops"]
    env_file: server.env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  ebpco-api:
    build:
      context: ./backend/apps/ebpco-api
      dockerfile: Dockerfile
      target: runtime
      args:
        # Set by deploy.sh. Absent, the Dockerfile's own defaults report
        # `unknown` — never an empty string, which fails config validation.
        BUILD_COMMIT: ${BUILD_COMMIT:-}
        BUILD_TIME: ${BUILD_TIME:-}
    restart: unless-stopped
    env_file: server.env
    ports:
      # PLAIN HTTP, OPEN TO THE INTERNET. Kept from the first deploy as a
      # fallback while the real domain's registration was on hold. Since
      # 2026-09-19 HTTPS works via 139-162-51-165.sslip.io and both Netlify
      # portals use it; the only remaining users of :3000 are developers'
      # local proxy configs (proxy.conf.json / proxy.conf.js). Once those
      # point at the HTTPS name, change this to "127.0.0.1:3000:3000" — a
      # staff login over this port crosses the internet unencrypted.
      - "0.0.0.0:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and ACME account. Losing this means re-issuing against
      # Let's Encrypt's rate limits.
      - ./data/caddy_data:/data
      - ./data/caddy_config:/config
    depends_on:
      - ebpco-api
